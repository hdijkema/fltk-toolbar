name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxft-dev libxinerama-dev libxcursor-dev libxfixes-dev libxrender-dev xvfb xauth
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DFLTK_BACKEND_WAYLAND=OFF
      - name: Build
        run: cmake --build build/ci --config Release --parallel 3
      - name: Check contracts on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build/ci -C Release --output-on-failure
      - name: Check contracts
        if: runner.os != 'Linux'
        run: ctest --test-dir build/ci -C Release --output-on-failure
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish tested source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^project\([^ ]+ VERSION ([0-9.]+).*$/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$version"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
